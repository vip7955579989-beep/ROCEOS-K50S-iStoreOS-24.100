name: 编译 ROCEOS K50S 专属 iStoreOS 24.12 固件

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '默认 LAN 口 IP 地址'
        required: true
        default: '192.168.0.254'
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. 检出编译配置库
        uses: actions/checkout@v4

      - name: 2. 准备 Linux 编译依赖环境与释放磁盘空间
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /etc/apt/sources.list.d/*
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools rsync unzip zlib1g-dev squashfs-tools device-tree-compiler swig python3-dev python3-setuptools
          sudo -E apt-get -qq clean

      - name: 3. 拉取 iStoreOS 24.12 官方源码
        run: |
          git clone --depth 1 https://github.com/istoreos/istoreos.git -b istoreos-24.12 openwrt || git clone --depth 1 https://github.com/istoreos/istoreos.git -b main openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 植入 ROCEOS K50S 专用设备树 (DTS) 与板级驱动配置
        run: |
          mkdir -p openwrt/target/linux/rockchip/dts/rockchip/
          cp -f patches/target/linux/rockchip/dts/rk3568-roc-k50s.dts openwrt/target/linux/rockchip/dts/rockchip/
          cp -f patches/target/linux/rockchip/dts/rk3568-roc-k50s.dtsi openwrt/target/linux/rockchip/dts/rockchip/
          
          TARGET_MK="openwrt/target/linux/rockchip/image/armv8.mk"
          [ ! -f "$TARGET_MK" ] && TARGET_MK="openwrt/target/linux/rockchip/image/Makefile"
          if [ -f "$TARGET_MK" ]; then
            printf "\ndefine Device/roceos_k50s\n  \$(call Device/rk3568)\n  DEVICE_VENDOR := ROCEOS\n  DEVICE_MODEL := K50S\n  SOC := rk3568\n  DEVICE_DTS := rockchip/rk3568-roc-k50s\n  UBOOT_IMAGE := k50s-rk3568-u-boot-rockchip.bin\n  SUPPORTED_DEVICES += roceos,k50s\n  DEVICE_PACKAGES := kmod-brcmfmac kmod-r8125 kmod-phy-realtek\nendef\nTARGET_DEVICES += roceos_k50s\n" >> "$TARGET_MK"
          fi

          mkdir -p openwrt/files/etc/board.d/
          mkdir -p openwrt/files/etc/uci-defaults/
          cp -f files/etc/board.d/02_network openwrt/files/etc/board.d/02_network
          
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          [ -z "$LAN_IP" ] && LAN_IP="192.168.0.254"
          
          echo "#!/bin/sh" > openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set network.lan.ipaddr='${LAN_IP}'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].timezone='CST-8'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].zonename='Asia/Shanghai'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci commit network" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci commit system" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "exit 0" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          chmod +x openwrt/files/etc/uci-defaults/99-custom-k50s

      - name: 5. 集成核心第三方应用 (OpenClash, Docker, Samba4, iStore)
        run: |
          cd openwrt
          rm -rf /tmp/openclash
          for i in 1 2 3 4 5; do
            git clone --depth 1 -b master https://github.com/vernesong/OpenClash.git /tmp/openclash && break || sleep 3
          done
          if [ -d "/tmp/openclash/luci-app-openclash" ]; then
            cp -r /tmp/openclash/luci-app-openclash package/luci-app-openclash
            rm -rf /tmp/openclash
          fi
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 6. 配置文件生成与下载依赖包
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_roceos_k50s=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=3072" >> .config
          # 网卡与硬件驱动 (RTL8125 2.5G, BRCM WiFi, USB3, SATA)
          echo "CONFIG_PACKAGE_kmod-r8125=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8169=y" >> .config
          echo "CONFIG_PACKAGE_kmod-phy-realtek=y" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ata-ahci=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          # iStore 商店与核心 UI
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
          # 核心网络与应用组件 (防止 dnsmasq 包冲突)
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_ipset=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_nftset=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
          make defconfig
          # 清除基础 dnsmasq 防止包文件冲突崩溃
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 7. 部署 u-boot 固件镜像依赖并启动编译
        run: |
          cd openwrt
          # 确保全路径注入 u-boot 二进制防止打包阶段丢失报错
          mkdir -p staging_dir/target-aarch64_generic_musl/image/
          mkdir -p build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/
          mkdir -p target/linux/rockchip/image/
          mkdir -p bin/targets/rockchip/armv8/
          cp -f ../u-boot/k50s-rk3568-u-boot-rockchip.bin staging_dir/target-aarch64_generic_musl/image/k50s-rk3568-u-boot-rockchip.bin
          cp -f ../u-boot/k50s-rk3568-u-boot-rockchip.bin target/linux/rockchip/image/k50s-rk3568-u-boot-rockchip.bin
          cp -f ../u-boot/k50s-rk3568-u-boot-rockchip.bin build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/k50s-rk3568-u-boot-rockchip.bin 2>/dev/null || true
          cp -f ../u-boot/k50s-rk3568-u-boot-rockchip.bin bin/targets/rockchip/armv8/k50s-rk3568-u-boot-rockchip.bin 2>/dev/null || true
          
          export FORCE_UNSAFE_CONFIGURE=1
          echo -e "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s
          
          # 对打包产物进行通用压缩整理
          cd bin/targets/rockchip/armv8/
          gzip -f *.img 2>/dev/null || true

      - name: 8. 上传 K50S Release 固件产物
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-24.12-ROCEOS-K50S-Firmware
          if-no-files-found: warn
          path: openwrt/bin/targets/rockchip/armv8/*
