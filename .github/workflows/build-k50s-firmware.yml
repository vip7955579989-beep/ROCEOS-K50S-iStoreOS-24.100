name: 编译 ROCEOS K50S 专属 iStoreOS 24.10 固件

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '默认 LAN 口 IP 地址'
        required: true
        default: '192.168.0.254'
        type: string
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. 检出编译配置库
        uses: actions/checkout@v4

      - name: 2. 释放 GitHub 云端磁盘空间 (原生 Bash 强力清理 30GB+)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /var/lib/docker /etc/apt/sources.list.d/* || true
          sudo -E apt-get -qq update || true
          sudo -E apt-get -qq install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-pyelftools rsync unzip zlib1g-dev squashfs-tools device-tree-compiler swig python3-dev python3-setuptools || true
          sudo -E apt-get -qq clean || true

      - name: 3. 拉取 iStoreOS 24.10 官方源码
        run: |
          git clone --depth 1 https://github.com/istoreos/istoreos.git -b istoreos-24.10 openwrt || git clone --depth 1 https://github.com/istoreos/istoreos.git -b main openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 植入原厂权威 DTS 设备树与 RUN 心跳灯/网络映射配置
        run: |
          mkdir -p openwrt/target/linux/rockchip/dts/rockchip/
          cp -f patches/target/linux/rockchip/dts/rk3568-roc-k50s.dts openwrt/target/linux/rockchip/dts/rockchip/ 2>/dev/null || true
          cp -f patches/target/linux/rockchip/dts/rk3568-roc-k50s.dtsi openwrt/target/linux/rockchip/dts/rockchip/ 2>/dev/null || true
          
          TARGET_MK="openwrt/target/linux/rockchip/image/armv8.mk"
          [ ! -f "$TARGET_MK" ] && TARGET_MK="openwrt/target/linux/rockchip/image/Makefile"
          if [ -f "$TARGET_MK" ] && ! grep -q "roceos_k50s" "$TARGET_MK"; then
            cat << 'EOF' >> "$TARGET_MK"

define Device/roceos_k50s
  $(call Device/rk3568)
  DEVICE_VENDOR := ROCEOS
  DEVICE_MODEL := K50S
  SOC := rk3568
  DEVICE_DTS := rockchip/rk3568-roc-k50s
  UBOOT_IMAGE := k50s-rk3568-u-boot-rockchip.bin
  SUPPORTED_DEVICES += roceos,k50s
  DEVICE_PACKAGES := kmod-brcmfmac kmod-r8125 kmod-phy-realtek
endef
TARGET_DEVICES += roceos_k50s
EOF
          fi

          mkdir -p openwrt/files/etc/board.d/
          mkdir -p openwrt/files/etc/uci-defaults/
          cp -f files/etc/board.d/02_network openwrt/files/etc/board.d/02_network 2>/dev/null || true
          
          LAN_IP="${{ github.event.inputs.lan_ip }}"
          [ -z "$LAN_IP" ] && LAN_IP="192.168.0.254"
          
          echo "#!/bin/sh" > openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set network.lan.ipaddr='${LAN_IP}'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].timezone='CST-8'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].zonename='Asia/Shanghai'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].led_green='green:sys'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci set system.@system[0].default_trigger='heartbeat'" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci commit network" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "uci commit system" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          echo "exit 0" >> openwrt/files/etc/uci-defaults/99-custom-k50s
          chmod +x openwrt/files/etc/uci-defaults/99-custom-k50s

      - name: 5. 配置文件生成与下载依赖包
        run: |
          cd openwrt
          echo "CONFIG_TARGET_rockchip=y" > .config
          echo "CONFIG_TARGET_rockchip_armv8=y" >> .config
          echo "CONFIG_TARGET_rockchip_armv8_DEVICE_roceos_k50s=y" >> .config
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=128" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=3072" >> .config
          echo "CONFIG_PACKAGE_kmod-r8125=y" >> .config
          echo "CONFIG_PACKAGE_kmod-r8169=y" >> .config
          echo "CONFIG_PACKAGE_kmod-phy-realtek=y" >> .config
          echo "CONFIG_PACKAGE_kmod-brcmfmac=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb3=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-storage-uas=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ata-ahci=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ext4=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-exfat=y" >> .config
          echo "CONFIG_PACKAGE_kmod-fs-ntfs3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-quickstart=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_ipset=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq_full_nftset=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-samba4=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-diskman=y" >> .config
          make defconfig
          sed -i 's/CONFIG_PACKAGE_dnsmasq=y/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: 6. 部署 u-boot 固件镜像依赖并启动编译
        run: |
          cd openwrt
          UBOOT_SRC="$GITHUB_WORKSPACE/u-boot/k50s-rk3568-u-boot-rockchip.bin"
          
          mkdir -p staging_dir/target-aarch64_generic_musl/image/
          mkdir -p build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/
          mkdir -p target/linux/rockchip/image/
          mkdir -p bin/targets/rockchip/armv8/
          
          if [ -f "$UBOOT_SRC" ]; then
            for dest in staging_dir/target-aarch64_generic_musl/image/ target/linux/rockchip/image/ build_dir/target-aarch64_generic_musl/linux-rockchip_armv8/ bin/targets/rockchip/armv8/; do
              mkdir -p "$dest"
              cp -f "$UBOOT_SRC" "$dest/k50s-rk3568-u-boot-rockchip.bin" 2>/dev/null || true
              cp -f "$UBOOT_SRC" "$dest/rockchip-u-boot-rk3568.bin" 2>/dev/null || true
              cp -f "$UBOOT_SRC" "$dest/rk3568-u-boot.bin" 2>/dev/null || true
              cp -f "$UBOOT_SRC" "$dest/u-boot-rockchip.bin" 2>/dev/null || true
            done
          fi
          
          export FORCE_UNSAFE_CONFIGURE=1
          echo -e "$(nproc) thread compile"
          if ! make -j$(nproc); then
            echo "=================================================="
            echo "多线程编译失败，正在切换单线程提取最精准报错日志..."
            echo "=================================================="
            make -j1 V=s
          fi

      - name: 7. 归档整理固件发布目录
        run: |
          mkdir -p bin_out
          find openwrt/bin/targets/ -type f \( -name "*.img*" -o -name "*.bin" -o -name "*.manifest" -o -name "*.buildinfo" \) -exec cp -f {} bin_out/ \; 2>/dev/null || true
          touch bin_out/BUILD_COMPLETE.txt

      - name: 8. 上传 K50S Release 固件产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: iStoreOS-24.10-ROCEOS-K50S-Firmware
          path: bin_out/

      - name: 9. 自动发布固件到 GitHub Release 发行版
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v24.10-K50S-Build${{ github.run_number }}
          name: ROCEOS K50S iStoreOS 24.10 硬件适配固件 Release v24.10-Build${{ github.run_number }}
          body: |
            ROCEOS K50S (Rockchip RK3568) 专属 iStoreOS 24.10 深度硬件适配固件自动编译发布完成！
            - 适配硬件：RK3568 SoC, 3 个 2.5G 电口 (eth0-2), 2 个 SFP 光口 (eth3-4)
            - 默认 LAN IP：192.168.0.254
          files: bin_out/*
          fail_on_unmatched_files: false
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
